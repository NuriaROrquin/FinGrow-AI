# Equivalente al .csproj: metadata del proyecto, dependencias y config de
# herramientas, todo en un archivo.

[project]
name = "fingrow-ai"
version = "0.1.0"
description = "Servicio de IA de FinGrow. Consumido por el backend .NET."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.29",      # lo necesita TestClient de FastAPI
    "ruff>=0.6",         # linter + formateador
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errores, imports ordenados, modernizaciones, bugs comunes
